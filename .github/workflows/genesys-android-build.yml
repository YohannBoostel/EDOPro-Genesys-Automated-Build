name: EDOPro Genesys - Android build

on:
  workflow_dispatch:
  push:
    branches: [ feature/genesys-android-build ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      - name: Get Android app project
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/edo9300/edopro-android.git android-project
          rm -rf android-project/deps/edopro

      - name: Check out Genesys source and submodules
        uses: actions/checkout@v4
        with:
          ref: feature/genesys-point-badge
          path: android-project/deps/edopro
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Lua source required by OCGCore
        shell: bash
        run: |
          # In the Genesys branch, ocgcore is a normal directory rather than a Git submodule.
          # Therefore its nested lua/src submodule is not populated by actions/checkout.
          git clone https://github.com/lua/lua.git android-project/deps/edopro/ocgcore/lua/src
          git -C android-project/deps/edopro/ocgcore/lua/src checkout 6e22fedb74cf0c9b6656e9fce8b7331db847c605

      - name: Register Genesys rules source in Android build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android-project/jni/Android.mk")
          text = path.read_text()
          marker = "$(GFRAME_PATH)/drawing.cpp \\\\"
          if "$(GFRAME_PATH)/genesys_rules.cpp" in text:
              print("Genesys rules source is already registered.")
          elif marker in text:
              text = text.replace(marker, marker + "\\n\\t\\t\\t\\t   $(GFRAME_PATH)/genesys_rules.cpp \\\\", 1)
              path.write_text(text)
              print("Registered genesys_rules.cpp in Android.mk.")
          else:
              raise SystemExit("Could not locate drawing.cpp entry in jni/Android.mk")
          PY

      - name: Verify Genesys source files
        shell: bash
        run: |
          echo "Checking required files:"
          test -f android-project/deps/edopro/gframe/drawing.cpp
          test -f android-project/deps/edopro/config/genesys_points.csv
          test -f android-project/deps/edopro/ocgcore/lua/src/lauxlib.h
          echo "Genesys source and Lua headers verified."

      - name: Build native Android libraries
        shell: bash
        working-directory: android-project
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          ndk-build -j2

      - name: Build APK
        shell: bash
        working-directory: android-project
        run: |
          touch local.properties
          ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EDOPro-Genesys-Android-APK
          path: android-project/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
