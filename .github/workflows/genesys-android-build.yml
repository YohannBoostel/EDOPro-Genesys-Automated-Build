name: EDOPro Genesys - Android build
# Rebuild after replacing std::filesystem APIs for compatibility with NDK 21.

on:
  workflow_dispatch:
  push:
    branches: [ feature/genesys-android-build ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    env:
      OS_NAME: linux
      USE_BUNDLED_FONT: 1
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      - name: Get Android app project
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/edo9300/edopro-android.git android-project
          rm -rf android-project/deps/edopro

      - name: Check out Genesys source and submodules
        uses: actions/checkout@v4
        with:
          ref: feature/genesys-point-badge
          path: android-project/deps/edopro
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Lua source required by OCGCore
        shell: bash
        run: |
          # In the Genesys branch, ocgcore is a normal directory rather than a Git submodule.
          # Therefore its nested lua/src submodule is not populated by actions/checkout.
          git clone https://github.com/lua/lua.git android-project/deps/edopro/ocgcore/lua/src
          git -C android-project/deps/edopro/ocgcore/lua/src checkout 6e22fedb74cf0c9b6656e9fce8b7331db847c605

      - name: Register Genesys rules and updater sources in Android build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android-project/jni/Android.mk")
          lines = path.read_text().splitlines()
          required = [
              "$(GFRAME_PATH)/genesys_rules.cpp",
              "$(GFRAME_PATH)/genesys_updater.cpp",
          ]
          missing = [source for source in required if not any(source in line for line in lines)]
          if missing:
              index = next((i for i, line in enumerate(lines) if "$(GFRAME_PATH)/drawing.cpp" in line), None)
              if index is None:
                  raise SystemExit("Could not locate drawing.cpp entry in jni/Android.mk")
              for offset, source in enumerate(missing, start=1):
                  lines.insert(index + offset, "\t\t\t\t   " + source + " \\")
              path.write_text("\n".join(lines) + "\n")
              print("Registered Genesys sources: " + ", ".join(missing))
          else:
              print("Genesys rules and updater sources are already registered.")
          PY
      - name: Verify Genesys source files
        shell: bash
        run: |
          echo "Checking required files:"
          test -f android-project/deps/edopro/gframe/drawing.cpp
          test -f android-project/deps/edopro/config/genesys_points.csv
          test -f android-project/deps/edopro/ocgcore/lua/src/lauxlib.h
          echo "Genesys source and Lua headers verified."

      - name: Download full EDOPro distribution assets
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.3 rsync p7zip-full
          mkdir -p src/main/assets/defaults src/main/assets/update
          curl --fail --retry 5 --connect-timeout 30 --location \
            --output NotoSansJP-Regular.otf \
            https://raw.githubusercontent.com/ProjectIgnis/Distribution/master/fonts/NotoSansJP-Regular.otf
          lua ci/bin2c.lua NotoSansJP-Regular.otf deps/edopro/gframe/CGUITTFont/bundled_font.cpp
          git clone --recurse-submodules https://github.com/ProjectIgnis/Distribution.git
          rsync -ar --exclude='.*' --exclude='*.sh' --exclude='script/.*' \
            --exclude='expansions/.*' --exclude='expansions/ci' --exclude='expansions/*rerelease*' \
            --exclude='expansions/README.md' --exclude='expansions/unofficial-fossil.cdb' \
            --exclude='expansions/release.cdb' --exclude='script/pre-release' \
            --exclude='textures/Backup' --exclude='puzzles' \
            Distribution/ src/main/assets/defaults/
          mkdir -p src/main/assets/defaults/deck
          rm -rf src/main/assets/defaults/config/*.json src/main/assets/defaults/config/languages/Thai
          cp Distribution/config/configs.prod.json src/main/assets/defaults/config/configs.json
          sed -i 's/dpi_scale = .*/dpi_scale = 2.000000/' src/main/assets/defaults/config/system.conf
          test -s deps/edopro/gframe/CGUITTFont/bundled_font.cpp
          test -s src/main/assets/defaults/config/system.conf
          test -d src/main/assets/defaults/config

      - name: Build native Android libraries
        shell: bash
        working-directory: android-project
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          ndk-build -j2

      - name: Generate Android asset indexes
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail
          mkdir -p src/main/assets/defaults src/main/assets/update
          touch src/main/assets/defaults/.nomedia src/main/assets/update/.nomedia
          cd src/main/assets/defaults
          find -L . ! -path . -type d | sed -E 's|^\./||' > ../index.txt
          find -L . ! -path . | sed -E 's|^\./||' > ../filelist.txt
          cd ../update
          find -L . ! -path . -type d | sed -E 's|^\./||' > ../indexu.txt
          find -L . ! -path . | sed -E 's|^\./||' > ../filelistu.txt
          test -s ../filelist.txt
          echo "Default asset files: $(wc -l < ../filelist.txt)"
          du -sh ../defaults

      - name: Download libWindbot Android dependency
        shell: bash
        working-directory: android-project
        run: |
          mkdir -p libs
          curl --fail --retry 5 --connect-timeout 30 --location \
            --output libs/libWindbot.aar \
            https://github.com/ProjectIgnis/windbot/releases/download/20250412/libWindbot.aar
          test -s libs/libWindbot.aar
          echo "libWindbot.aar downloaded successfully."

      - name: Build APK
        shell: bash
        working-directory: android-project
        run: |
          touch local.properties
          ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EDOPro-Genesys-Android-APK
          path: android-project/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
