name: EDOPro Genesys - Android build

on:
  workflow_dispatch:
  push:
    branches: [ feature/genesys-android-build ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;21.4.7075529"

      - name: Get Android app project
        shell: bash
        run: |
          git clone --recurse-submodules https://github.com/edo9300/edopro-android.git android-project

      - name: Replace upstream EDOPro source with Genesys branch
        shell: bash
        run: |
          rm -rf android-project/deps/edopro
          git clone --recurse-submodules --branch feature/genesys-point-badge \
            https://github.com/YohannBoostel/EDOPro-Genesys-Automated-Build.git \
            android-project/deps/edopro
          test -f android-project/deps/edopro/gframe/drawing.cpp
          test -f android-project/deps/edopro/config/genesys_points.csv

      - name: Build native Android libraries
        shell: bash
        working-directory: android-project
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/21.4.7075529"
          export ANDROID_NDK="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_NDK_HOME:$PATH"
          ndk-build -j2

      - name: Build APK
        shell: bash
        working-directory: android-project
        run: |
          # The upstream Gradle file expects local.properties to exist.
          touch local.properties
          ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EDOPro-Genesys-Android-APK
          path: android-project/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
