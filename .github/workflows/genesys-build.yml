name: EDOPro Genesys - Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

# Mantém o build separado da instalação original do usuário.
jobs:
  build-windows:
    runs-on: windows-2022
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      # O script travis/get-windows-vcpkg-cache.sh exige esta variável.
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPLOY_DIR: deploy
      PICS_URL: ""
      FIELDS_URL: ""
      COVERS_URL: ""
      DISCORD_APP_ID: ""
      UPDATE_URL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          
      - name: Update Genesys points list
        shell: pwsh
        run: |
          python scripts/update_genesys_points.py
          
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Garante os fontes Lua exigidos pelo ygopro-core. Em alguns checkouts
      # o gitlink lua/src não está registrado no índice e o submodule update
      # com caminho explícito falha com "pathspec did not match".
      - name: Ensure Lua source headers
        shell: bash
        run: |
          git submodule update --init --recursive
          if [ ! -f ocgcore/lua/src/lauxlib.h ]; then
            echo "Lua headers missing; retrieving official Lua source into ocgcore/lua/src"
            rm -rf ocgcore/lua/src
            mkdir -p ocgcore/lua
            git clone --depth 1 https://github.com/lua/lua.git ocgcore/lua/src
          fi
          if [ ! -f ocgcore/lua/src/lauxlib.h ]; then
            echo "ERROR: lauxlib.h is still missing after retrieving Lua sources."
            echo "Lua directory listing:"
            ls -la ocgcore/lua/src || true
            echo "Submodule status:"
            git submodule status --recursive || true
            exit 1
          fi
          echo "Lua headers found: ocgcore/lua/src/lauxlib.h"

      # O projeto gera os arquivos Visual Studio com o toolset v141_xp
      # porque o script travis/build.sh usa --oldwindows=true.
      # O runner windows-2022 não instala esse toolset por padrão.
      - name: Install winxp components
        shell: pwsh
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToAdd = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          [string]$workloadArgs = $componentsToAdd | ForEach-Object { " --add " + $_ }
          $Arguments = @('/c', 'vs_installer.exe', 'modify', '--installPath', "`"$InstallPath`"", $workloadArgs, '--quiet', '--norestart', '--nocache')
          # The upstream EDOPro workflow runs the Visual Studio installer twice.
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) {
              throw "Visual Studio installer failed on attempt $attempt with exit code $($process.ExitCode)."
            }
          }

      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh

      - name: Install Windows build dependencies
        shell: bash
        run: ./travis/dependencies.sh

      - name: Compile EDOPro client
        shell: bash
        run: ./travis/build.sh

      - name: Package client executable
        shell: bash
        run: ./travis/predeploy.sh

      - name: Include Genesys points list
        shell: pwsh
        run: |
          $source = "config/genesys_points.csv"
          $destination = "deploy/config/genesys_points.csv"

          if (!(Test-Path $source)) {
            throw "Genesys points CSV not found: $source"
          }

          New-Item -ItemType Directory -Force -Path "deploy/config" | Out-Null
          Copy-Item $source $destination -Force

          $lineCount = (Get-Content $destination).Count
          Write-Host "Genesys points CSV copied to deploy. Lines: $lineCount"

      - name: Upload compiled client
        uses: actions/upload-artifact@v4
        with:
          name: EDOPro-Genesys-Windows-client
          path: deploy/
          if-no-files-found: error
          retention-days: 7
