name: EDOPro Genesys - Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

# Mantém o build separado da instalação original do usuário.
jobs:
  build-windows:
    runs-on: windows-2022
    env:
      TRAVIS_OS_NAME: windows
      BUILD_CONFIG: release
      ARCH: x86
      DXSDK_DIR: /c/d3d9sdk/
      VCPKG_ROOT: /c/vcpkg2
      DEPENDENCIES_BASE_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download
      # O script travis/get-windows-vcpkg-cache.sh exige esta variável.
      VCPKG_CACHE_ZIP_URL: https://github.com/edo9300/edopro-vcpkg-cache/releases/latest/download/installed_x86-windows-static.zip
      DEPLOY_DIR: deploy
      PICS_URL: ""
      FIELDS_URL: ""
      COVERS_URL: ""
      DISCORD_APP_ID: ""
      UPDATE_URL: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # O projeto gera os arquivos Visual Studio com o toolset v141_xp
      # porque o script travis/build.sh usa --oldwindows=true.
      # O runner windows-2022 não instala esse toolset por padrão.
      - name: Install Visual C++ v141 and Windows XP build tools
        shell: pwsh
        run: |
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $components = @(
            "Microsoft.VisualStudio.Component.VC.v141.x86.x64",
            "Microsoft.VisualStudio.Component.WinXP"
          )
          foreach ($component in $components) {
            & $installer modify --installPath $installPath --add $component --quiet --norestart --nocache
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao instalar o componente do Visual Studio: $component (código $LASTEXITCODE)"
            }
          }

      - name: Install Premake
        shell: bash
        run: ./travis/install-premake5.sh

      - name: Install Windows build dependencies
        shell: bash
        run: ./travis/dependencies.sh

      - name: Compile EDOPro client
        shell: bash
        run: ./travis/build.sh

      - name: Package client executable
        shell: bash
        run: ./travis/predeploy.sh

      - name: Upload compiled client
        uses: actions/upload-artifact@v4
        with:
          name: EDOPro-Genesys-Windows-client
          path: deploy/ygoprodll.exe
          if-no-files-found: error
          retention-days: 7
